<title>Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Apple-artige Seitenleiste links, Inhalt in Karten rechts; schmal: Navigation oben als Leiste.
   Farben = Apple-Systemfarben, Typo = iOS-Skala „Large“, Systemschrift (SF auf Apple-Geräten). */
:root{
  --blue:#007aff;--blue-text:#0066cc;--green:#34c759;--green-text:#1f8a3a;--orange:#ff9500;--orange-text:#b25e00;
  --red:#ff3b30;--red-text:#d70015;--purple:#af52de;--indigo:#5856d6;--purple-text:#8944ab;--teal:#30b0c7;--gray:#8e8e93;
  --label:#000;--label-2:#6e6e73;--label-3:#8e8e93;--bg:#f2f2f7;--surface:#fff;--surface-2:#f7f7fa;
  --fill:rgba(120,120,128,.12);--fill-2:rgba(120,120,128,.2);--sep:rgba(60,60,67,.18);
  --glass:rgba(246,246,248,.78);--glass-dicht:rgba(252,252,253,.96);--glass-border:rgba(0,0,0,.06);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--shadow-hover:0 2px 4px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.1);
  --t-red:rgba(255,59,48,.12);--t-blue:rgba(0,122,255,.12);--t-orange:rgba(255,149,0,.14);--t-green:rgba(52,199,89,.14);--t-purple:rgba(175,82,222,.12);--t-gray:rgba(142,142,147,.14);
  --font:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r-card:20px;--r-ctl:12px;--side:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#0a84ff;--blue-text:#409cff;--green:#30d158;--green-text:#30d158;--orange:#ff9f0a;--orange-text:#ffb340;
  --red:#ff453a;--red-text:#ff6961;--purple:#bf5af2;--indigo:#5e5ce6;--purple-text:#da8fff;--teal:#40c8e0;
  --label:#fff;--label-2:#aeaeb2;--label-3:#8e8e93;--bg:#000;--surface:#1c1c1e;--surface-2:#232325;
  --fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);--sep:rgba(84,84,88,.6);
  --glass:rgba(28,28,30,.78);--glass-dicht:rgba(36,36,38,.96);--glass-border:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-hover:0 2px 4px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5);
  --t-red:rgba(255,69,58,.2);--t-blue:rgba(10,132,255,.22);--t-orange:rgba(255,159,10,.2);--t-green:rgba(48,209,88,.2);--t-purple:rgba(191,90,242,.22);--t-gray:rgba(142,142,147,.24);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#0a84ff;--blue-text:#409cff;--green:#30d158;--green-text:#30d158;--orange:#ff9f0a;--orange-text:#ffb340;
  --red:#ff453a;--red-text:#ff6961;--purple:#bf5af2;--indigo:#5e5ce6;--purple-text:#da8fff;--teal:#40c8e0;
  --label:#fff;--label-2:#aeaeb2;--label-3:#8e8e93;--bg:#000;--surface:#1c1c1e;--surface-2:#232325;
  --fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);--sep:rgba(84,84,88,.6);
  --glass:rgba(28,28,30,.78);--glass-dicht:rgba(36,36,38,.96);--glass-border:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-hover:0 2px 4px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5);
  --t-red:rgba(255,69,58,.2);--t-blue:rgba(10,132,255,.22);--t-orange:rgba(255,159,10,.2);--t-green:rgba(48,209,88,.2);--t-purple:rgba(191,90,242,.22);--t-gray:rgba(142,142,147,.24);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:1.0625rem;line-height:22px;letter-spacing:-.026em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
a{color:var(--blue-text)}

.t-lt{font-size:2.125rem;line-height:41px;font-weight:700;letter-spacing:.012em;text-wrap:balance}
.t-t2{font-size:1.375rem;line-height:28px;font-weight:700;letter-spacing:-.012em}
.t-t3{font-size:1.25rem;line-height:25px;font-weight:600;letter-spacing:-.023em}
.t-hl{font-size:1.0625rem;line-height:22px;font-weight:600}
.t-sub{font-size:.9375rem;line-height:20px;letter-spacing:-.016em}
.t-fn{font-size:.8125rem;line-height:18px;letter-spacing:-.006em}
.t-c1{font-size:.75rem;line-height:16px;letter-spacing:0}
.t-title1{font-size:1.75rem;line-height:34px;font-weight:700;letter-spacing:.014em}
.c2{color:var(--label-2)}.num{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100%}
.side{position:sticky;top:0;align-self:flex-start;height:100vh;width:var(--side);flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding:20px 12px 16px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-right:.5px solid var(--glass-border)}
.marke{padding:0 12px}
.suche-knopf{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:var(--r-ctl);background:var(--fill);color:var(--label-2);text-align:left}
.suche-knopf kbd{margin-left:auto;font:inherit;font-size:.75rem;background:var(--surface);border-radius:6px;padding:1px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-ctl);color:var(--label);text-decoration:none}
.nav a:hover{background:var(--fill)}
.nav a[aria-current="page"]{background:var(--fill-2);font-weight:600}
.ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ico svg{width:17px;height:17px}
.mark{margin-top:auto;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.mark .rund{width:36px;height:36px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label-2)}

main{flex:1;min-width:0;padding-block:40px 64px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.kopf{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.kopf p{margin-top:4px}
section>h2{margin-bottom:12px}
.zeile-titel{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow)}
.gruppe{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.gruppe>li+li{border-top:.5px solid var(--sep)}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}

.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border-radius:var(--r-ctl);font-size:1rem;font-weight:600;transition:transform .16s cubic-bezier(.2,.8,.2,1),filter .16s}
a.knopf{text-decoration:none}
.knopf svg{width:18px;height:18px;flex:none}
.knopf{white-space:nowrap}
.knopf:active{transform:scale(.97)}
.primaer{background:var(--blue);color:#fff}.primaer:hover{filter:brightness(1.06)}
.sekundaer{background:var(--fill);color:var(--blue-text)}.sekundaer:hover{background:var(--fill-2)}
.knopf:disabled{opacity:.45;cursor:not-allowed}
.feld{min-height:44px;width:100%;padding:0 12px;border-radius:var(--r-ctl);background:var(--fill);border:1px solid transparent}
textarea.feld{padding:10px 12px;min-height:88px;resize:vertical}
.feld::placeholder{color:var(--label-3)}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(0,122,255,.35);border-radius:var(--r-ctl)}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:.8125rem;line-height:18px;color:var(--label-2)}

.pille{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.75rem;line-height:16px;font-weight:600;white-space:nowrap;letter-spacing:0}
.pille svg{width:12px;height:12px}
.meta{background:var(--fill);color:var(--label-2);font-weight:500}
.warn{background:var(--t-red);color:var(--red-text)}

.top3 a{display:flex;flex-direction:column;gap:12px;height:100%;padding:20px;color:inherit;text-decoration:none;transition:box-shadow .2s}
.top3 a:hover{box-shadow:var(--shadow-hover)}
.platz{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.top3 .fuss{margin-top:auto}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--fill)}
.tabs button{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;font-size:.9375rem;color:var(--label-2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--label);font-weight:600;box-shadow:var(--shadow)}
.tabs .z{font-size:.75rem;color:var(--label-2)}
.werkzeug{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
.werkzeug .knopf{margin-left:auto}
.filter{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 220px 220px;margin-bottom:24px}
.mit-ico{position:relative}.mit-ico svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--label-3);pointer-events:none}
.mit-ico .feld{padding-left:40px}

.az{scroll-margin-top:96px}
.az-kopf{display:flex;align-items:flex-start;gap:12px;padding:12px 16px}
.haken{width:44px;height:44px;margin:-10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.haken span{width:24px;height:24px;border-radius:50%;border:2px solid var(--label-3);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.haken[aria-pressed="true"] span{background:var(--green);border-color:var(--green)}
.az-text{flex:1;min-width:0;text-align:left;border-radius:10px}
.az-titel{display:flex;gap:8px;align-items:flex-start}
.az-titel .t{flex:1}
.az-titel svg{width:18px;height:18px;color:var(--label-3);flex-shrink:0;margin-top:2px;transition:transform .2s}
.az-text[aria-expanded="true"] .az-titel svg{transform:rotate(180deg)}
.erledigt .az-titel .t{text-decoration:line-through;color:var(--label-2)}
.pillen{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.az-detail{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));padding:16px;border-top:.5px solid var(--sep);background:var(--surface-2)}
.az-detail .breit{grid-column:1/-1}
.gruppen{display:flex;flex-direction:column;gap:24px}
.gruppen h2{display:flex;align-items:baseline;gap:8px;padding:0 4px;margin-bottom:8px}

.ziel{display:flex;flex-direction:column;gap:12px;padding:20px}
.ziel .oben{display:flex;justify-content:space-between;gap:8px}
.balken{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.balken div{height:100%;background:var(--green);border-radius:99px;transition:width .5s}
.ziel form{display:flex;gap:8px}
.stift{width:44px;height:44px;margin:-10px -12px 0 0;display:flex;align-items:center;justify-content:center;color:var(--blue-text);border-radius:var(--r-ctl)}
.stift svg{width:17px;height:17px}

.box{padding:20px;display:flex;flex-direction:column;gap:12px}
.box h2{display:flex;align-items:center;gap:8px;margin:0}
.box h2 svg{width:18px;height:18px}
.liste-klein{display:flex;flex-direction:column;gap:8px}
.liste-klein a{color:inherit;text-decoration:none}
.liste-klein a:hover{text-decoration:underline}
.briefing{display:flex;align-items:center;gap:16px;padding:24px}
.briefing .ico{width:48px;height:48px;border-radius:14px}
.briefing .ico svg{width:24px;height:24px}
.briefing>div{flex:1;min-width:0}
.brief-voll{padding:24px;display:flex;flex-direction:column;gap:16px}
.brief-kopf{display:flex;align-items:center;gap:16px}
.brief-kopf .ico{width:48px;height:48px;border-radius:14px}.brief-kopf .ico svg{width:24px;height:24px}
.brief-text{max-width:72ch}
.brief-abschnitte{display:grid;gap:16px 24px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.brief-abschnitte ul{list-style:disc;padding-left:18px;margin-top:4px;display:flex;flex-direction:column;gap:4px}
.frei-liste{display:flex;flex-direction:column;gap:16px}
.frei{padding:20px;display:flex;flex-direction:column;gap:10px}
.frei-kopf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.frei-inhalt{white-space:pre-wrap;background:var(--surface-2);border-radius:14px;padding:14px 16px;max-width:72ch}
.frei-edit{min-height:180px}
.frei-knoepfe{display:flex;flex-wrap:wrap;gap:12px}
details summary{cursor:pointer;min-height:32px;display:flex;align-items:center;gap:4px}
.steckbrief{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.steckbrief dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px}
.steckbrief ul{list-style:disc;padding-left:18px;display:flex;flex-direction:column;gap:2px}
@media (max-width:560px){.steckbrief dl{grid-template-columns:minmax(0,1fr)}}
.ereignis{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:12px 16px}
.ereignis .d{flex-basis:100%}

.partner{padding:20px;display:flex;flex-direction:column;gap:16px}
.partner .oben{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:600;flex-shrink:0}
.chance{padding:16px;display:flex;flex-direction:column;gap:10px}
.chance .oben{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chance-felder{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chance-knoepfe{display:flex;flex-wrap:wrap;gap:8px}
.lead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:8px 16px;min-height:56px}
.lead-haupt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.lead-name{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lead-aktion{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lead-aktion .knopf{min-height:44px;font-size:.9375rem;padding:0 12px}
.lead-aktion select.feld{width:auto;min-width:150px;font-size:.9375rem}
.lead.kompakt{padding:6px 16px;align-items:center}
.lead.kompakt .lead-haupt{gap:0}
.lead-mehr ul{padding-left:18px;list-style:disc;margin:4px 0}
.lead-mehr summary{min-height:32px;display:flex;align-items:center;cursor:pointer}
.lead-werkzeug{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.vertrag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vertrag dd{font-weight:600}
@media (max-width:640px){.lead{flex-direction:column}.lead-aktion{justify-content:flex-start;width:100%}.vertrag{grid-template-columns:1fr 1fr}}
.chance-knoepfe .knopf{min-height:44px;font-size:.9375rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.ums-kopf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.monate{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:170px}
.monate li{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.monate .saeule{width:100%;max-width:36px;flex:1;display:flex;align-items:flex-end;background:var(--fill);border-radius:8px;overflow:hidden}
.monate .saeule div{width:100%;background:var(--indigo);border-radius:8px 8px 0 0;min-height:0}
table.jahre{width:100%;border-collapse:collapse;font-size:.9375rem}
table.jahre th,table.jahre td{padding:10px 8px;text-align:right;border-top:.5px solid var(--sep);white-space:nowrap}
table.jahre th:first-child{text-align:left}
table.jahre thead th{color:var(--label-2);font-weight:600;font-size:.8125rem;border-top:0}
@media (max-width:760px){.ums-kopf{grid-template-columns:repeat(2,minmax(0,1fr))}.monate{gap:3px}}
@media (max-width:560px){.monate li>span:first-child{display:none}}
.chance-felder .f{display:flex;flex-direction:column;gap:4px}
@media (max-width:560px){.chance-felder{grid-template-columns:1fr}}
.zahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.zahlen div{background:var(--fill);border-radius:12px;padding:8px 0}
.agent{padding:20px;display:flex;flex-direction:column;gap:12px}
.agent .oben{display:flex;align-items:center;gap:12px}
.agent .kreis{width:44px;height:44px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.ampel{display:inline-flex;align-items:center;gap:6px}
.ampel i{width:10px;height:10px;border-radius:50%;display:inline-block}
.werkz{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.leer{padding:56px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.leer .ico{width:64px;height:64px;border-radius:18px;margin-bottom:8px}
.leer .ico svg{width:30px;height:30px}
.leer p{max-width:520px}
.hinweis{padding:16px 20px;border-radius:16px;background:var(--t-orange);color:var(--label)}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.dialog{width:100%;max-width:640px;border-radius:20px;border:.5px solid var(--glass-border);background:var(--glass-dicht);-webkit-backdrop-filter:saturate(180%) blur(32px);backdrop-filter:saturate(180%) blur(32px);box-shadow:var(--shadow-hover);overflow:hidden;animation:ein .3s cubic-bezier(.2,.8,.2,1) both}
.pal-kopf{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:.5px solid var(--sep)}
.pal-kopf svg{width:20px;height:20px;color:var(--label-2)}
.pal-kopf input{flex:1;min-height:56px;background:transparent;border:0;outline:0;font-size:1.25rem}
.pal-kopf input:focus-visible{box-shadow:none}
.pal-liste{max-height:50vh;overflow-y:auto;padding:8px}
.pal-gruppe{padding:12px 12px 4px;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--label-2)}
.pal-liste button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:12px;text-align:left}
.pal-liste button .u{margin-left:auto;font-size:.8125rem;color:var(--label-2);white-space:nowrap}
.pal-liste button[aria-selected="true"]{background:var(--blue);color:#fff}
.pal-liste button[aria-selected="true"] .u{color:rgba(255,255,255,.85)}
.blatt{max-width:560px;padding:24px;background:var(--surface);align-self:center}
.blatt form{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.blatt .breit{grid-column:1/-1}
.blatt .aktionen{grid-column:1/-1;display:flex;justify-content:flex-end;gap:12px}

@keyframes ein{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.ein{animation:ein .36s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.knopf:active{transform:none}}
@media (prefers-reduced-transparency:reduce){.side,.dialog{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface)}}

@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.az-detail{grid-template-columns:repeat(2,minmax(0,1fr))}}

function umsatzHtml(){
  const gew = S.pipeline.filter(c=>c.stufe==="Gewonnen");

function freigabenHtml(){
  const offen = S.freigaben.filter(f=>f.status==="wartet").sort((a,b)=>String(a.erstelltAm).localeCompare(String(b.erstelltAm)));
  const kopfZeile = `<div class="zeile-titel"><h2 id="h-frei" class="t-t2">Wartet auf deine Freigabe</h2>${offen.length?`<span class="t-sub c2">${offen.length} offen</span>`:""}</div>`;
  if(!offen.length) return `<section aria-labelledby="h-frei">${kopfZeile}<div class="card t-sub c2" style="padding:20px">Nichts offen. Hier landen Nachrichten-Entwürfe, Mails und Dateiaktionen der Agenten, bevor irgendetwas rausgeht.</div></section>`;
  return `<section aria-labelledby="h-frei">${kopfZeile}<ul class="frei-liste">${offen.map(f=>{
    const bearb = S.bearbeite===f.id;
    const meta = [f.empfaenger&&`an ${f.empfaenger}`, f.kanal, f.bezug].filter(Boolean).map(esc).join(" · ");
    return `<li class="card frei" data-fid="${esc(f.id)}">
      <div class="frei-kopf"><span class="pille" style="background:var(--t-purple);color:var(--purple-text)">${ic("schild")}${esc(f.art||"Entwurf")}</span><span class="t-fn c2">${esc(f.agent||"Agent")}</span></div>
      <h3 class="t-hl">${esc(f.titel)}</h3>
      ${meta?`<p class="t-fn c2">${meta}</p>`:""}
      ${bearb?`<label class="f"><span>Text bearbeiten</span><textarea id="fe-${esc(f.id)}" class="feld frei-edit" data-frei-text>${esc(f.inhalt||"")}</textarea></label>`:`<details class="frei-det"><summary class="t-sub" style="font-weight:600;color:var(--blue-text);min-height:44px;display:flex;align-items:center">Text anzeigen</summary><div class="frei-inhalt t-sub">${linkify(f.inhalt)}</div></details>`}
      ${f.hinweis?`<p class="t-fn c2">${esc(f.hinweis)}</p>`:""}
      <div class="frei-knoepfe">
        ${bearb
          ? `<button class="knopf primaer" data-frei="speichern">Speichern</button><button class="knopf sekundaer" data-frei="abbrechen">Abbrechen</button>`
          : `<button class="knopf primaer" data-frei="freigeben" ${S.nurLesen?"disabled":""}>Freigeben</button><button class="knopf sekundaer" data-frei="bearbeiten" ${S.nurLesen?"disabled":""}>Bearbeiten</button><button class="knopf sekundaer" data-frei="verwerfen" style="color:var(--red-text)" ${S.nurLesen?"disabled":""}>Verwerfen</button>`}
      </div>
    </li>`; }).join("")}</ul><p class="t-fn c2" style="margin-top:8px">„Freigeben“ kopiert Nachrichten in die Zwischenablage, damit du sie selbst verschickst. Dateiaktionen führt der Drive-Agent beim nächsten Lauf aus.</p></section>`;
}

function gespraecheHtml(){
  const g = [...S.gespraeche].sort((a,b)=>String(b.datum).localeCompare(String(a.datum))).slice(0,3);
  return `<section class="card box" aria-labelledby="h-ges"><h2 id="h-ges" class="t-hl"><span style="color:var(--blue-text);display:flex">${ic("bot")}</span>Gespräche mit Alex</h2>${g.length?`<ul class="liste-klein">${g.map(x=>`<li><details><summary class="t-sub"><span class="c2 num">${esc(datumDe(x.datum))}</span> · ${esc(x.titel||"Gespräch")}</summary><p class="t-fn c2" style="margin-top:6px;white-space:pre-wrap">${esc(x.zusammenfassung||"")}</p></details></li>`).join("")}</ul>`:`<p class="t-sub c2">Noch keine Gespräche im Gehirn. Sie kommen jeden Morgen aus dem Alex-Sheet dazu.</p>`}</section>`;
}

function seiteHeute(){
  const d = new Date();
  const std = Number(new Intl.DateTimeFormat("de-DE",{hour:"numeric",hour12:false,timeZone:"Europe/Luxembourg"}).format(d));
  const gruss = std<11?"Guten Morgen, Danny":std<18?"Hallo Danny":"Guten Abend, Danny";
  const datum = new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Luxembourg"}).format(d);
  const wartet = S.aufgaben.filter(a=>a.status==="wartet");
  const pruefen = S.aufgaben.filter(a=>a.status==="prüfen").length;
  const ziele = S.ziele.filter(z=>!String(z.ziel).startsWith("Bestand"));
  return `${kopf(gruss, esc(datum))}
  ${verbindungsHinweis()}
  ${briefingHtml(pruefen)}
  ${anruflisteHtml()}
  ${freigabenHtml()}
  <section aria-labelledby="h-top"><div class="zeile-titel"><h2 id="h-top" class="t-t2">Top 3 heute</h2><a class="t-sub" style="font-weight:600;text-decoration:none" href="#aufgaben">Alle Aufgaben</a></div>${top3Html()}</section>
  <div class="grid3">
    <section class="card box" aria-labelledby="h-ter"><h2 id="h-ter" class="t-hl"><span style="color:var(--red-text);display:flex">${ic("kal")}</span>Termine</h2><p class="t-sub c2">Noch kein Kalender verbunden. Verbinde Google Kalender in Claude unter Einstellungen → Connectoren, dann stehen die Termine im Briefing.</p></section>
    ${gespraecheHtml()}
    <section class="card box" aria-labelledby="h-wart"><h2 id="h-wart" class="t-hl"><span style="color:var(--orange-text);display:flex">${ic("sanduhr")}</span>Du wartest auf</h2>${wartet.length?`<ul class="liste-klein">${wartet.map(a=>`<li><a class="t-sub" href="#${a.id}">${esc(a.aufgabe)} <span class="c2">· ${esc(partnerVon(a).join(", "))}</span></a>${a.wartetAuf?`<div class="t-fn c2">${esc(a.wartetAuf)}</div>`:""}</li>`).join("")}</ul>`:`<p class="t-sub c2">${geladen()?"Nichts.":"…"}</p>`}</section>
  </div>
  <section aria-labelledby="h-ziele"><h2 id="h-ziele" class="t-t2">Ziele</h2>${ziele.length?`<div class="grid4">${ziele.map(zielHtml).join("")}</div>`:`<div class="card c2" style="padding:24px">${S.geladen.ziele?"Noch keine Ziele im Gehirn.":"Ziele werden geladen …"}</div>`}</section>
  <section aria-labelledby="h-verl"><h2 id="h-verl" class="t-t2">Zuletzt im Gehirn</h2>${S.ereignisse.length?`<ul class="gruppe">${S.ereignisse.map(e=>`<li class="ereignis"><span class="t-fn c2 num">${esc(zeitDe.format(new Date(e.zeit)))}</span><span class="t-sub" style="font-weight:600">${esc(e.akteur)}</span><span class="t-sub">${esc(e.aktion)}${e.objekt?` · ${esc(e.objekt)}`:""}</span>${e.details?`<span class="t-fn c2 d">${esc(e.details)}</span>`:""}</li>`).join("")}</ul>`:`<div class="card t-sub c2" style="padding:20px">Noch keine Einträge.</div>`}</section>`;
}

function formatZ(w,einheit){ return einheit==="EUR" ? `${zahl.format(w)} €` : zahl.format(w); }
function zielHtml(z){
  const ausPipe = z.id==="z1" && S.pipeline.length>0;
  const ist = ausPipe ? pipeZahlen().gewonnen : Number(z.ist)||0, soll = Number(z.soll)||0, anteil = soll>0 ? Math.min(ist/soll,1) : 0;
  const bearb = !ausPipe && S.offen.has("ziel:"+z.id);
  return `<div class="card ziel"><div class="oben"><div><div class="t-hl">${esc(z.ziel)}</div><div class="t-fn c2">${esc(z.einheit==="EUR"?z.zeitraum:`${z.einheit} · ${z.zeitraum}`)}</div></div>${ausPipe?`<a class="t-fn" href="#pipeline" style="font-weight:600;text-decoration:none">aus Pipeline</a>`:`<button class="stift" data-aktion="ziel-bearb" data-id="${esc(z.id)}" aria-label="Ist-Wert für ${esc(z.ziel)} eintragen" ${S.nurLesen?"disabled":""}>${ic("stift")}</button>`}</div>
  <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap"><span class="t-title1 num">${formatZ(ist,z.einheit)}</span><span class="t-sub c2">von ${formatZ(soll,z.einheit)}</span></div>
  <div class="balken" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(anteil*100)}" aria-label="${esc(z.ziel)}: ${Math.round(anteil*100)} Prozent"><div style="width:${anteil*100}%"></div></div>
  ${ausPipe?`<p class="t-fn c2">Gewonnen laut Pipeline (ohne Bestand)</p>`:""}
  ${bearb?`<form data-form="ziel" data-id="${esc(z.id)}"><label style="flex:1"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ist-Wert</span><input id="ziel-${esc(z.id)}" name="ist" class="feld" inputmode="decimal" value="${z.ist??""}"></label><button class="knopf primaer">Sichern</button></form>`:""}</div>`;
}

function seiteAufgaben(){
  const offenAnz = S.aufgaben.filter(a=>a.status!=="erledigt").length;
  const pruefAnz = S.aufgaben.filter(a=>a.status==="prüfen").length;
  const v = ANSICHTEN.find(x=>x[0]===S.ansicht);
  const s = S.suche.trim().toLowerCase();
  const gef = sortiert().filter(a =>
    (!v[2] || v[2].includes(a.status)) &&
    (!S.fPartner || partnerVon(a).includes(S.fPartner) || (S.fPartner!=="C&E intern" && partnerVon(a).includes("Alle Partner"))) &&
    (!S.fZust || a.zustaendig===S.fZust) &&
    (!s || `${a.aufgabe} ${a.naechsterSchritt||""} ${a.id} ${partnerVon(a).join(" ")}`.toLowerCase().includes(s)));
  const zaehl = id => { const x = ANSICHTEN.find(y=>y[0]===id); return x[2] ? S.aufgaben.filter(a=>x[2].includes(a.status)).length : S.aufgaben.length; };
  const partnerNamen = S.partner.map(p=>p.name).sort();
  let gruppen = "";
  for(const g of [1,2,3,4,null]){
    const liste = gef.filter(a => a.status==="erledigt" ? g===null : prio(a)===g);
    if(!liste.length) continue;
    const titel = g===null ? (S.ansicht==="erledigt"?"Erledigt":"Noch nicht eingeschätzt") : `${g} ${PRIO_NAME[g]}`;
    const erkl = g===null ? (S.ansicht==="erledigt"?"":"Wichtig und Dringend setzen") : PRIO_ERKL[g];
    gruppen += `<section aria-labelledby="g-${g}"><h2 id="g-${g}"><span class="t-t3">${titel}</span><span class="t-sub c2">${liste.length}${erkl?` · ${erkl}`:""}</span></h2><ul class="gruppe">${liste.map(zeileHtml).join("")}</ul></section>`;
  }
  return `${kopf("Aufgaben", geladen()?`${offenAnz} offen${pruefAnz?` · ${pruefAnz} zum Prüfen aus früheren Gesprächen`:""}`:"Wird geladen …")}
  ${verbindungsHinweis()}
  <section aria-labelledby="h-top"><h2 id="h-top" class="t-t2">Top 3 heute</h2>${top3Html()}</section>
  <section aria-label="Aufgabenliste">
    <div class="werkzeug"><div class="tabs" role="tablist" aria-label="Ansicht">${ANSICHTEN.map(([id,t])=>`<button role="tab" aria-selected="${S.ansicht===id}" data-aktion="ansicht" data-id="${id}">${t}<span class="z num">${zaehl(id)}</span></button>`).join("")}</div>
    <button class="knopf primaer" data-aktion="neu" ${S.nurLesen||!S.db?"disabled":""}>${ic("plus",'width="18" height="18"')}Neue Aufgabe</button></div>
    <div class="filter">
      <label class="mit-ico">${ic("lupe")}<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Aufgaben durchsuchen</span><input id="f-suche" class="feld" placeholder="Durchsuchen" value="${esc(S.suche)}"></label>
      <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Partner</span><select id="f-partner" class="feld"><option value="">Alle Partner</option>${[...partnerNamen,"C&E intern"].map(p=>`<option ${S.fPartner===p?"selected":""}>${esc(p)}</option>`).join("")}</select></label>
      <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Zuständig</span><select id="f-zust" class="feld"><option value="">Alle Zuständigen</option>${ZUST.map(z=>`<option ${S.fZust===z?"selected":""}>${z}</option>`).join("")}</select></label>
    </div>
    ${geladen() && !gef.length ? `<div class="card c2" style="padding:40px;text-align:center">Keine Aufgaben in dieser Ansicht.</div>` : ""}
    <div class="gruppen">${gruppen}</div>
  </section>`;
}

function auswahl(id, label, feld, wert, optionen, leer){
  return `<label class="f"><span>${label}</span><select id="${id}" class="feld" data-feld="${feld}" ${S.nurLesen?"disabled":""}>${leer!==undefined?`<option value="">${leer}</option>`:""}${optionen.map(o=>`<option ${o===wert?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
}
const jaNein = w => w===true?"ja":w===false?"nein":"";

function zeileHtml(a){
  const p = prio(a), erl = a.status==="erledigt", ue = ueberfaellig(a), offen = S.offen.has(a.id);
  const pillen = [
    erl ? "" : prioPille(p),
    a.status!=="offen" ? statusPille(a.status) : "",
    ...partnerVon(a).map(x=>`<span class="pille meta">${esc(x)}</span>`),
    a.umsatzhebel ? `<span class="pille meta">Hebel: ${esc(a.umsatzhebel)}</span>` : "",
    a.faelligAm ? `<span class="pille ${ue?"warn":"meta"}">${ue?"überfällig":"fällig"} ${datumDe(a.faelligAm)}</span>` : "",
    a.zustaendig && a.zustaendig!=="Danny" ? `<span class="pille meta">${esc(a.zustaendig)}</span>` : ""
  ].join("");
  const k = a.id;
  return `<li id="${k}" class="az ${erl?"erledigt":""}" data-id="${k}">
    <div class="az-kopf">
      <button class="haken" data-aktion="haken" aria-pressed="${erl}" aria-label="${esc(a.aufgabe)} ${erl?"wieder öffnen":"erledigen"}" ${S.nurLesen?"disabled":""}><span>${erl?ic("haken",'width="14" height="14" stroke="#fff" stroke-width="3"'):""}</span></button>
      <button class="az-text" data-aktion="auf" aria-expanded="${offen}" aria-controls="d-${k}">
        <div class="az-titel"><span class="t">${esc(a.aufgabe)}</span>${ic("pfeil")}</div>
        <div class="pillen">${pillen}</div>
        ${a.naechsterSchritt && !offen ? `<p class="t-sub c2 clamp1" style="margin-top:6px">${esc(a.naechsterSchritt)}</p>` : ""}
      </button>
    </div>
    ${offen ? `<div class="az-detail ein" id="d-${k}">
      ${auswahl(`s-${k}`,"Status","status",a.status,STATUS)}
      ${auswahl(`w-${k}`,"Wichtig","wichtig",jaNein(a.wichtig),["ja","nein"],"offen")}
      ${auswahl(`dr-${k}`,"Dringend","dringend",jaNein(a.dringend),["ja","nein"],"offen")}
      ${auswahl(`h-${k}`,"Umsatzhebel","umsatzhebel",a.umsatzhebel||"",HEBEL,"–")}
      <label class="f"><span>Fällig am</span><input id="fa-${k}" type="date" class="feld" data-feld="faelligAm" value="${esc(a.faelligAm||"")}" ${S.nurLesen?"disabled":""}></label>
      ${auswahl(`z-${k}`,"Zuständig","zustaendig",a.zustaendig||"",ZUST,"–")}
      ${auswahl(`b-${k}`,"Bereich","bereich",a.bereich||"",BEREICHE,"–")}
      <label class="f"><span>Wartet auf / seit</span><input id="wa-${k}" class="feld" data-feld="wartetAuf" data-text value="${esc(a.wartetAuf||"")}" ${S.nurLesen?"disabled":""}></label>
      <label class="f breit"><span>Nächster Schritt</span><textarea id="n-${k}" class="feld" data-feld="naechsterSchritt" data-text ${S.nurLesen?"disabled":""}>${esc(a.naechsterSchritt||"")}</textarea></label>
      <p class="t-fn c2 breit">${esc(a.id)} · Quelle: ${esc(a.quelle||"–")} · erstellt ${datumDe(a.erstelltAm)}${a.projekt?` · Projekt: ${esc(a.projekt)}`:""}</p>
    </div>` : ""}
  </li>`;
}

function seitePartner(){
  const offen = S.aufgaben.filter(a=>a.status!=="erledigt");
  const pa = [...S.partner].sort((x,y)=>x.name.localeCompare(y.name));
  return `${kopf("Partner", `${pa.length} aktive Partnerbetriebe`)}${verbindungsHinweis()}
  <ul class="grid2">${pa.map((p,i)=>{ const eig = offen.filter(a=>partnerVon(a).includes(p.name)||partnerVon(a).includes("Alle Partner")); const sof = eig.filter(a=>prio(a)===1).length; const wa = eig.filter(a=>a.status==="wartet").length;
    return `<li class="card partner ein" style="animation-delay:${i*50}ms"><div class="oben"><span class="av" style="background:${AV_FARBEN[i%AV_FARBEN.length]}">${esc(p.name.slice(0,1))}</span><div style="min-width:0"><h2 class="t-t3">${esc(p.name)}</h2><p class="t-fn c2">${p.vertrag?esc([p.vertrag.volumenJahr?euro(p.vertrag.volumenJahr)+"/Jahr":null, p.vertrag.umfang, p.vertrag.status].filter(Boolean).join(" · ")):"Partner-Agent folgt in Phase 6"}</p></div></div>
    ${p.vertrag?`<dl class="vertrag t-fn"><div><dt class="c2">Ansprechpartner</dt><dd>${esc(p.vertrag.ansprechpartner||"–")}</dd></div><div><dt class="c2">Vertragsende</dt><dd>${esc(p.vertrag.vertragsende||"–")}</dd></div><div><dt class="c2">Sprache</dt><dd>${esc(p.vertrag.sprache||"–")}</dd></div></dl>${p.vertrag.notiz?`<p class="t-fn c2">${esc(p.vertrag.notiz)}</p>`:""}`:""}
    <dl class="zahlen"><div><dt class="t-c1 c2">offen</dt><dd class="t-t3 num">${eig.length}</dd></div><div><dt class="t-c1 c2">sofort</dt><dd class="t-t3 num" ${sof?'style="color:var(--red-text)"':""}>${sof}</dd></div><div><dt class="t-c1 c2">wartet</dt><dd class="t-t3 num">${wa}</dd></div></dl>
    ${eig.length?`<ul class="liste-klein">${eig.sort(vergleich).slice(0,3).map(a=>`<li><a class="t-sub" href="#${a.id}">${esc(a.aufgabe)}</a></li>`).join("")}</ul>`:""}
    ${steckbriefHtml(p)}
    <p class="t-fn c2" style="margin-top:auto">${p.driveOrdner?`Drive: ${esc(p.driveOrdner)}`:""}${p.web?` · ${esc(p.web)}`:""}</p></li>`; }).join("")}</ul>`;
}

function steckbriefHtml(p){
  const s = p.steckbrief; if(!s) return `<p class="t-fn c2">Steckbrief folgt.</p>`;
  const liste = a => Array.isArray(a)&&a.length ? `<ul>${a.map(x=>`<li class="t-sub">${esc(typeof x==="string"?x:[x.titel,x.betrag,x.datum,x.status].filter(Boolean).join(" · "))}</li>`).join("")}</ul>` : `<span class="t-sub c2">–</span>`;
  const leute = Array.isArray(s.ansprechpartner)&&s.ansprechpartner.length ? s.ansprechpartner.map(a=>esc([a.name,a.rolle].filter(Boolean).join(", "))).join("<br>") : "–";
  return `<details class="steckbrief"><summary class="t-sub" style="font-weight:600;color:var(--blue-text)">Steckbrief</summary>
    ${s.positionierung?`<p class="t-sub">${esc(s.positionierung)}</p>`:""}
    <dl>
      <dt class="t-fn c2">Branche</dt><dd class="t-sub">${esc(s.branche||"–")}${s.ort?` · ${esc(s.ort)}`:""}</dd>
      <dt class="t-fn c2">Ansprechpartner</dt><dd class="t-sub">${leute}</dd>
      <dt class="t-fn c2">Zielgruppe</dt><dd class="t-sub">${esc(s.zielgruppe||"–")}</dd>
      <dt class="t-fn c2">Leistungen C&amp;E</dt><dd>${liste(s.leistungenCE)}</dd>
      <dt class="t-fn c2">Projekte</dt><dd>${liste(s.laufendeProjekte)}</dd>
      <dt class="t-fn c2">Angebote</dt><dd>${liste(s.angebote)}</dd>
      <dt class="t-fn c2">Fakten</dt><dd>${liste(s.wichtigeFakten)}</dd>
      <dt class="t-fn c2">Bewertungen &amp; Empfehlungen</dt><dd>${liste((p.bewertungen||[]).map(b=>`${b.was}: ${b.stand}`))}</dd>
      <dt class="t-fn c2">Offene Fragen</dt><dd>${liste(s.offeneFragen)}</dd>
    </dl></details>`;
}

function seiteAgenten(){
  const EB = {1:["Stimme","Mit ihnen sprichst du."],2:["Kern-Team","Halten den Alltag zusammen."],3:["Fach-Agenten","Partnerbetriebe, Akquise und Content."]};
  const ST = {aktiv:["var(--green)","aktiv"],test:["var(--blue)","Test"],pausiert:["var(--orange)","pausiert"],geplant:["var(--gray)","geplant"]};
  const ag = [...S.agenten].sort((x,y)=>(x.ebene-y.ebene)||((x.reihe??0)-(y.reihe??0)));
  return `${kopf("Agenten", `${ag.length} Agenten · ${ag.filter(a=>a.status==="aktiv").length} aktiv`)}${verbindungsHinweis()}
  ${[1,2,3].map(e=>`<section aria-labelledby="eb-${e}"><h2 id="eb-${e}" class="t-t2" style="margin-bottom:2px">Ebene ${e}: ${EB[e][0]}</h2><p class="t-sub c2" style="margin-bottom:12px">${EB[e][1]}</p><ul class="grid3">${ag.filter(a=>a.ebene===e).map(a=>{ const [f,t]=ST[a.status]||ST.geplant; return `<li class="card agent"><div class="oben"><span class="kreis">${esc(a.name.replace("Partner-Agent ","").slice(0,1))}</span><div style="flex:1;min-width:0"><h3 class="t-hl">${esc(a.name)}</h3><p class="t-fn c2">${esc(a.rolle)}</p></div><span class="ampel t-fn"><i style="background:${f}"></i>${t}</span></div><p class="t-sub c2">${esc(a.beschreibung)}</p><div class="werkz">${(a.werkzeuge||[]).map(w=>`<span class="pille meta">${esc(w)}</span>`).join("")}</div><p class="t-fn c2">${a.letzteAktion?`Zuletzt: ${esc(a.letzteAktion)}`:a.status==="aktiv"?"Läuft in ElevenLabs":a.phase?`Wird in Phase ${a.phase} gebaut`:"Wartet auf Freischaltung"}</p>

/* ---------- Schreiben ins Gehirn ---------- */
async function protokoll(aktion, objekt, details){
  if(!S.db) return;
  try{ await S.db.collection("ereignisse").add({zeit:new Date().toISOString(), akteur:"Danny", aktion, objekt, details}); }catch(e){}
}
function schreibFehler(e){
  if(e && e.code==="invalid_argument"){ S.nurLesen = true; }
  S.fehler = e && e.code==="invalid_argument" ? "Du hast hier nur Lesezugriff." : "Speichern hat nicht geklappt. Bitte noch einmal versuchen.";
  zeigeToast(S.fehler); render();
}
const FELDNAME = {status:"Status",wichtig:"Wichtig",dringend:"Dringend",umsatzhebel:"Umsatzhebel",faelligAm:"Fällig am",zustaendig:"Zuständig",bereich:"Bereich",wartetAuf:"Wartet auf",naechsterSchritt:"Nächster Schritt"};
async function aendere(id, feld, roh){
  if(!S.db) return;
  let wert = roh;
  if(feld==="wichtig"||feld==="dringend") wert = roh==="ja"?true:roh==="nein"?false:null;
  else if(typeof roh==="string"){ wert = roh.trim()===""?null:roh.trim(); }
  const a = S.aufgaben.find(x=>x.id===id); if(!a) return;
  if(a[feld]===wert) return;
  try{
    await S.db.doc("aufgaben/"+id).update({[feld]:wert, aktualisiertAm:new Date().toISOString()});
    protokoll("Aufgabe geändert", id, `${FELDNAME[feld]}: ${wert===true?"ja":wert===false?"nein":wert??"leer"}`);
  }catch(e){ schreibFehler(e); }
}
function naechsteId(){ const m = S.aufgaben.reduce((x,a)=>Math.max(x, Number(String(a.id).replace(/\D/g,""))||0),0); return "AUF-"+String(m+1).padStart(4,"0"); }
async function lege(form){
  const g = n => (form.elements[n]?.value||"").trim();
  const titel = g("aufgabe"); if(!titel || !S.db) return null;
  const id = naechsteId(), jetzt = new Date().toISOString(), jn = v => v==="ja"?true:v==="nein"?false:null;
  const doc = {aufgabe:titel, partner:g("partner")?[g("partner")]:[], bereich:g("bereich")||null, wichtig:jn(g("wichtig")), dringend:jn(g("dringend")), umsatzhebel:g("umsatzhebel")||null, faelligAm:g("faelligAm")||null, zustaendig:g("zustaendig")||"Danny", status:"offen", wartetAuf:null, naechsterSchritt:g("naechsterSchritt")||null, quelle:"Cockpit", projekt:null, erstelltAm:jetzt.slice(0,10), aktualisiertAm:jetzt};
  try{ await S.db.doc("aufgaben/"+id).set(doc); protokoll("Aufgabe angelegt", id, titel); return id; }
  catch(e){ schreibFehler(e); return null; }
}
const PFELD = {stufe:"Stufe",art:"Zählt als",betrag:"Betrag",abgeschlossenAm:"Abgeschlossen am",datum:"Angebot vom",wahrscheinlichkeit:"Wahrscheinlichkeit"};
async function aenderePipe(id, feld, roh){
  if(!S.db) return;
  const c = S.pipeline.find(x=>x.id===id); if(!c) return;
  let wert = roh;
  if(feld==="betrag"||feld==="wahrscheinlichkeit"){
    const t = String(roh??"").trim().replace(/[€%\s]/g,"").replace(/\./g,"").replace(",",".");
    wert = t===""?null:Number(t);
    if(wert!==null && Number.isNaN(wert)){ zeigeToast("Bitte eine Zahl eingeben, zum Beispiel 25.000"); render(); return; }
    if(feld==="wahrscheinlichkeit" && wert!==null) wert = Math.max(0,Math.min(100,Math.round(wert)));
  }
  if(c[feld]===wert) return;
  const upd = {[feld]:wert, aktualisiertAm:new Date().toISOString()};
  if(feld==="stufe" && wert==="Gewonnen" && !c.abgeschlossenAm) upd.abgeschlossenAm = heute();
  try{ await S.db.doc("pipeline/"+id).update(upd); protokoll("Pipeline geändert", id, `${PFELD[feld]}: ${wert??"leer"}`); }
  catch(e){ schreibFehler(e); }
}
async function neueChance(form){
  const g = n => (form.elements[n]?.value||"").trim();
  const titel = g("titel"); if(!titel || !S.db) return;
  const t = g("betrag").replace(/[€\s]/g,"").replace(/\./g,"").replace(",",".");

}

function pipeAuftrag(id, was){
  const c = S.pipeline.find(x=>x.id===id); if(!c) return;
  const partner = S.partner.some(p=>p.name===c.partner) ? c.partner : "";
  if(was==="alex"){ window.open("https://elevenlabs.io/app/talk-to?agent_id=agent_9401krkr50b3fn4bqahad1xykkmy","_blank","noopener"); return; }
  const V = {
    followup:{titel:"Auftrag an den Akquise-Agenten", aufgabe:`Follow-up entwerfen: ${c.titel}${c.partner?` (${c.partner})`:""}`, zustaendig:"Akquise-Agent", bereich:"Akquise", schritt:`Pipeline ${id}: Nachfass-Nachricht zum Angebot über ${euro(c.betrag)} als Entwurf zur Freigabe.`},

function agentAuftrag(aid){
  const a = S.agenten.find(x=>x.id===aid); if(!a) return;
  const partnerName = a.id.startsWith("partner-") ? (S.partner.find(p=>"partner-"+p.id===a.id)||{}).name : "";
  const zust = a.id.startsWith("partner-") ? "Partner-Agent" : (ZUST.includes(a.name) ? a.name : "Claude Code");
  oeffneNeu({titel:`Auftrag an ${a.name}`, zustaendig:zust, partner:partnerName||"", bleiben:true});
}
async function leadErgebnis(id, erg){
  if(!S.db || !erg) return;
  const l = S.leads.find(x=>x.id===id); if(!l) return;
  const jetzt = new Date().toISOString();
  const verlauf = [...(l.verlauf||[]), {datum:heute(), ergebnis:erg}];
  const upd = {verlauf, letzterKontakt:heute(), aktualisiertAm:jetzt};
  if(istAnfrage(l)){ if(erg==="Empfehlung erhalten"||erg==="Keine Empfehlung") upd.stufe = "Erledigt"; }
  else if(erg==="Termin vereinbart") { upd.stufe = "Vorgespräch"; upd.naechsterSchritt = "Termin vorbereiten"; }
  else if(erg==="Kein Interesse") upd.stufe = "Kein Interesse";
  else if(erg==="Unterlagen schicken") { upd.naechsterSchritt = "Unterlagen schicken, dann nachfassen"; if(["Neu","Empfehlung"].includes(l.stufe)) upd.stufe="Angesprochen"; }
  else if(["Neu","Empfehlung"].includes(l.stufe)) upd.stufe = "Angesprochen";
  try{
    await S.db.doc("leads/"+id).update(upd); protokoll("Anruf", id, `${l.betrieb}: ${erg}`);
    if(erg==="Empfehlung erhalten") oeffneLead({quelle:`Empfehlung ${l.partner||""}`.trim(), prioritaet:"A"});
    else zeigeToast(`${l.betrieb}: ${erg}`);
    if(erg==="Termin vereinbart" && !S.pipeline.some(c=>c.leadId===id)){
      const cid = "c-"+Date.now().toString(36);
      await S.db.doc("pipeline/"+cid).set({titel:"Erstgespräch", partner:l.betrieb, betrag:null, datum:heute(), stufe:"Gespräch", art:"neu", wahrscheinlichkeit:null, quelle:null, notiz:l.quelle||null, naechsterSchritt:"Termin vorbereiten", leadId:id, erstelltAm:jetzt, aktualisiertAm:jetzt});
    }
  }catch(e){ schreibFehler(e); }
}

  let el = document.getElementById("toast");

let palAuswahl = 0, palEintraege = [];
function oeffnePalette(){
  vorherFokus = document.activeElement;
  schicht.innerHTML = `<div class="overlay" data-schliessen><div class="dialog" role="dialog" aria-modal="true" aria-label="Befehlspalette">
    <div class="pal-kopf">${ic("lupe")}<input id="pal-eingabe" placeholder="Suchen, springen, anlegen …" aria-label="Suchbegriff" aria-controls="pal-liste" autocomplete="off"><kbd class="t-c1 c2" style="font:inherit;font-size:.75rem">esc</kbd></div>
    <ul class="pal-liste" id="pal-liste" role="listbox"></ul></div></div>`;
  const inp = document.getElementById("pal-eingabe");
  inp.addEventListener("input", ()=>{ palAuswahl = 0; palRender(inp.value); });
  inp.addEventListener("keydown", e => {
    if(e.key==="ArrowDown"){ e.preventDefault(); palAuswahl = Math.min(palAuswahl+1, palEintraege.length-1); palRender(inp.value); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); palAuswahl = Math.max(palAuswahl-1,0); palRender(inp.value); }
    else if(e.key==="Enter"){ e.preventDefault(); palEintraege[palAuswahl]?.los(); }
  });
  palRender(""); inp.focus();
}
function palRender(q){
  const liste = [
    {g:"Aktionen", t:"Neue Aufgabe", ico:"plus", los:()=>{ schliesseSchicht(); location.hash="aufgaben"; setTimeout(oeffneNeu,50); }},
    ...NAV.map((n,i)=>({g:"Gehe zu", t:n.titel, u:`⌘${i+1}`, ico:n.ico, los:()=>{ schliesseSchicht(); location.hash=n.id; }})),
    ...sortiert().map(a=>({g:"Aufgaben", t:a.aufgabe, u:`${a.id} · ${a.status}`, s:`${partnerVon(a).join(" ")} ${a.naechsterSchritt||""}`, ico:"punkt", los:()=>{ schliesseSchicht(); S.ansicht="alle"; S.offen.add(a.id); location.hash=a.id; }}))
  ];
  const s = q.trim().toLowerCase();
  palEintraege = s ? liste.filter(e=>`${e.t} ${e.u||""} ${e.s||""}`.toLowerCase().includes(s)).slice(0,30) : liste.filter(e=>e.g!=="Aufgaben");
  let letzte = "";
  const ul = document.getElementById("pal-liste");
  ul.innerHTML = palEintraege.length ? palEintraege.map((e,i)=>{ const k = e.g!==letzte ? `<li role="presentation" class="pal-gruppe">${e.g}</li>` : ""; letzte = e.g; return `${k}<li role="presentation"><button role="option" id="pal-${i}" data-i="${i}" aria-selected="${i===palAuswahl}">${ic(e.ico,'width="18" height="18"')}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.t)}</span>${e.u?`<span class="u">${esc(e.u)}</span>`:""}</button></li>`; }).join("") : `<li class="t-sub c2" style="padding:16px 12px">Nichts gefunden.</li>`;
  document.getElementById("pal-eingabe").setAttribute("aria-activedescendant", palEintraege.length?`pal-${palAuswahl}`:"");
  ul.querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest"});
}

schicht.addEventListener("click", e => {
  const b = e.target.closest("#pal-liste button[data-i]"); if(b){ palEintraege[Number(b.dataset.i)]?.los(); return; }

const seite = document.getElementById("seite");
async function freigabeAktion(fid, was){
  const f = S.freigaben.find(x=>x.id===fid); if(!f || !S.db) return;
  const jetzt = new Date().toISOString();
  try{
    if(was==="bearbeiten"){ S.bearbeite = fid; render(); document.getElementById("fe-"+fid)?.focus(); return; }
    if(was==="abbrechen"){ S.bearbeite = null; render(); return; }
    if(was==="speichern"){
      const t = document.getElementById("fe-"+fid)?.value ?? f.inhalt;
      S.bearbeite = null; document.activeElement?.blur();
      await S.db.doc("freigaben/"+fid).update({inhalt:t, bearbeitetAm:jetzt});
      protokoll("Entwurf bearbeitet", fid, f.titel); zeigeToast("Entwurf gespeichert"); render(); return;
    }
    if(was==="freigeben"){
      let kopiert = false;
      if(f.inhalt && f.art!=="Dateiaktion"){ try{ await navigator.clipboard.writeText(f.inhalt); kopiert = true; }catch(e){} }
      await S.db.doc("freigaben/"+fid).update({status:"freigegeben", entschiedenAm:jetzt});
      if(fid==="akquiseplan-12m"){ try{ await S.db.doc("system/akquiseplan").update({status:"freigegeben", freigegebenAm:jetzt}); }catch(e){} }
      protokoll("Freigegeben", fid, f.titel);
      zeigeToast(kopiert ? "Freigegeben und kopiert. Jetzt einfügen und selbst senden." : "Freigegeben");
      return;
    }
    if(was==="verwerfen"){
      await S.db.doc("freigaben/"+fid).update({status:"verworfen", entschiedenAm:jetzt});
      protokoll("Verworfen", fid, f.titel); zeigeToast("Verworfen"); return;
    }
  }catch(e){ schreibFehler(e); }
}

seite.addEventListener("click", e => {
  const pj = e.target.closest("[data-pjahr]"); if(pj){ S.pJahr = pj.dataset.pjahr; render(); return; }
  if(e.target.closest("[data-pneu]")){ oeffneChance(); return; }
  if(e.target.closest("[data-lneu]")){ oeffneLead(); return; }
  const lf = e.target.closest("[data-lfilter]"); if(lf){ S.lFilter = lf.dataset.lfilter; render(); return; }
  const pa = e.target.closest("[data-pauftrag]"); if(pa){ const k = pa.closest("[data-cid]"); if(k) pipeAuftrag(k.dataset.cid, pa.dataset.pauftrag); return; }
  const ag = e.target.closest("[data-agauftrag]"); if(ag){ agentAuftrag(ag.dataset.agauftrag); return; }
  const zl = e.target.closest("[data-zust]"); if(zl){ S.fZust = zl.dataset.zust; S.fPartner=""; S.suche=""; S.ansicht="alle"; }
  const fb = e.target.closest("[data-frei]");
  if(fb){ const li = fb.closest("[data-fid]"); if(li) freigabeAktion(li.dataset.fid, fb.dataset.frei); return; }
  const el = e.target.closest("[data-aktion]");
  const ans = e.target.closest("[data-ansicht]"); if(ans){ S.ansicht = ans.dataset.ansicht; }
  if(!el) return;
  const akt = el.dataset.aktion, li = el.closest("[data-id]");
  if(akt==="ansicht"){ S.ansicht = el.dataset.id; render(); }
  else if(akt==="neu"){ oeffneNeu(); }
  else if(akt==="auf"){ const id = li.dataset.id; S.offen.has(id)?S.offen.delete(id):S.offen.add(id); render(); }
  else if(akt==="haken"){ const a = S.aufgaben.find(x=>x.id===li.dataset.id); if(a) aendere(a.id,"status",a.status==="erledigt"?"offen":"erledigt"); }
  else if(akt==="ziel-bearb"){ const k="ziel:"+el.dataset.id; S.offen.has(k)?S.offen.delete(k):S.offen.add(k); render(); document.getElementById("ziel-"+el.dataset.id)?.focus(); }
});

  if(t.id==="f-zust"){ S.fZust = t.value; render(); return; }
  if(t.hasAttribute("data-lergebnis")){ const r = t.closest("[data-lid]"); if(r) leadErgebnis(r.dataset.lid, t.value); return; }
  if(t.dataset.pfeld){ const k = t.closest("[data-cid]"); if(k) aenderePipe(k.dataset.cid, t.dataset.pfeld, t.value||null); return; }
  const feld = t.dataset.feld; if(!feld) return;
  const li = t.closest("[data-id]"); if(!li) return;
  if(t.hasAttribute("data-text")) return; // Textfelder speichern beim Verlassen
  aendere(li.dataset.id, feld, t.value);
});
seite.addEventListener("input", e => { if(e.target.id==="l-suche"){ S.lSuche = e.target.value; clearTimeout(seite._l); seite._l = setTimeout(()=>{ const pos = e.target.selectionStart; S.renderOffen=false; document.activeElement.blur(); render(); const n=document.getElementById("l-suche"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }, 180); return; } if(e.target.id==="f-suche"){ S.suche = e.target.value; clearTimeout(seite._s); seite._s = setTimeout(()=>{ const pos = e.target.selectionStart; S.renderOffen=false; const f=document.activeElement; f.blur(); render(); const n=document.getElementById("f-suche"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }, 180); } });
seite.addEventListener("focusout", e => {
  const t = e.target;
  if(t.hasAttribute && t.hasAttribute("data-text")){ const li = t.closest("[data-id]"); if(li) aendere(li.dataset.id, t.dataset.feld, t.value); }
  setTimeout(()=>{ if(S.renderOffen && !(document.activeElement && document.activeElement.matches && document.activeElement.matches("main textarea, main input[data-text], main input#f-suche, main form input"))) render(); }, 0);
});
seite.addEventListener("submit", e => {
  const f = e.target; if(f.dataset.form!=="ziel") return;
  e.preventDefault(); const id = f.dataset.id; const w = f.elements.ist.value;
  S.offen.delete("ziel:"+id); document.activeElement?.blur(); render(); setzeZiel(id, w);
});

document.getElementById("suche-knopf").addEventListener("click", oeffnePalette);
window.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if(mod && e.key.toLowerCase()==="k"){ e.preventDefault(); schicht.innerHTML ? schliesseSchicht() : oeffnePalette(); return; }
  if(mod && /^[1-9]$/.test(e.key)){ e.preventDefault(); location.hash = NAV[Number(e.key)-1].id; return; }
  if(e.key==="Escape" && schicht.innerHTML){ e.preventDefault(); schliesseSchicht(); }
});
window.addEventListener("hashchange", () => {
  const v = ansichtAus();
  if(v.aufgabe){ if(!S.offen.has(v.aufgabe)){ S.offen.add(v.aufgabe); } const a = S.aufgaben.find(x=>x.id===v.aufgabe); if(a){ const pass = ANSICHTEN.find(x=>x[0]===S.ansicht); if(pass[2] && !pass[2].includes(a.status)) S.ansicht="alle"; } }
  render();
  if(v.aufgabe) requestAnimationFrame(()=>document.getElementById(v.aufgabe)?.scrollIntoView({block:"center"}));
  else window.scrollTo(0,0);
});

/* ---------- Gehirn verbinden ---------- */
render();
(async () => {
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db = null; }
  S.verbunden = true;
  if(!db){ render(); return; }
  S.db = db;
  const abo = (name, setze, q) => (q||db.collection(name)).onSnapshot(snap => { setze(snap.docs.map(d=>({id:d.id, ...d.data()}))); S.geladen[name]=true; render(); }, err => { if(err && err.code==="revoked"){ S.db=null; } render(); });
  abo("aufgaben", v => S.aufgaben = v);
  abo("ziele", v => S.ziele = v.sort((a,b)=>String(a.id).localeCompare(String(b.id))));
  abo("partner", v => S.partner = v);
  abo("agenten", v => S.agenten = v);
  abo("ereignisse", v => S.ereignisse = v, db.collection("ereignisse").orderBy("zeit","desc").limit(8));
  abo("briefings", v => S.briefings = v, db.collection("briefings").orderBy("erstelltAm","desc").limit(2));
  abo("freigaben", v => S.freigaben = v);
  abo("pipeline", v => S.pipeline = v);
  abo("leads", v => S.leads = v);
  abo("gespraeche", v => S.gespraeche = v, db.collection("gespraeche").orderBy("datum","desc").limit(5));
  const v = ansichtAus(); if(v.aufgabe){ S.ansicht="alle"; S.offen.add(v.aufgabe); }
  render();
})();
})();
</script>
