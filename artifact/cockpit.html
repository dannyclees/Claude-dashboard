<title>Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Apple-artige Seitenleiste links, Inhalt in Karten rechts; schmal: Navigation oben als Leiste.
   Farben = Apple-Systemfarben, Typo = iOS-Skala „Large“, Systemschrift (SF auf Apple-Geräten). */
:root{
  --blue:#007aff;--blue-text:#0066cc;--green:#34c759;--green-text:#1f8a3a;--orange:#ff9500;--orange-text:#b25e00;
  --red:#ff3b30;--red-text:#d70015;--purple:#af52de;--indigo:#5856d6;--purple-text:#8944ab;--teal-text:#0a6f82;--teal:#30b0c7;--gray:#8e8e93;
  --label:#000;--label-2:#6e6e73;--label-3:#8e8e93;--bg:#f2f2f7;--surface:#fff;--surface-2:#f7f7fa;
  --fill:rgba(120,120,128,.12);--fill-2:rgba(120,120,128,.2);--sep:rgba(60,60,67,.18);
  --glass:rgba(246,246,248,.78);--glass-dicht:rgba(252,252,253,.96);--glass-border:rgba(0,0,0,.06);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--shadow-hover:0 2px 4px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.1);
  --t-red:rgba(255,59,48,.12);--t-blue:rgba(0,122,255,.12);--t-teal:rgba(48,176,199,.16);--t-orange:rgba(255,149,0,.14);--t-green:rgba(52,199,89,.14);--t-purple:rgba(175,82,222,.12);--t-gray:rgba(142,142,147,.14);
  --font:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r-card:20px;--r-ctl:12px;--side:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#0a84ff;--blue-text:#409cff;--green:#30d158;--green-text:#30d158;--orange:#ff9f0a;--orange-text:#ffb340;
  --red:#ff453a;--red-text:#ff6961;--purple:#bf5af2;--indigo:#5e5ce6;--purple-text:#da8fff;--teal-text:#6fdcee;--teal:#40c8e0;
  --label:#fff;--label-2:#aeaeb2;--label-3:#8e8e93;--bg:#000;--surface:#1c1c1e;--surface-2:#232325;
  --fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);--sep:rgba(84,84,88,.6);
  --glass:rgba(28,28,30,.78);--glass-dicht:rgba(36,36,38,.96);--glass-border:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-hover:0 2px 4px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5);
  --t-red:rgba(255,69,58,.2);--t-blue:rgba(10,132,255,.22);--t-teal:rgba(64,200,224,.22);--t-orange:rgba(255,159,10,.2);--t-green:rgba(48,209,88,.2);--t-purple:rgba(191,90,242,.22);--t-gray:rgba(142,142,147,.24);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#0a84ff;--blue-text:#409cff;--green:#30d158;--green-text:#30d158;--orange:#ff9f0a;--orange-text:#ffb340;
  --red:#ff453a;--red-text:#ff6961;--purple:#bf5af2;--indigo:#5e5ce6;--purple-text:#da8fff;--teal-text:#6fdcee;--teal:#40c8e0;
  --label:#fff;--label-2:#aeaeb2;--label-3:#8e8e93;--bg:#000;--surface:#1c1c1e;--surface-2:#232325;
  --fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);--sep:rgba(84,84,88,.6);
  --glass:rgba(28,28,30,.78);--glass-dicht:rgba(36,36,38,.96);--glass-border:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-hover:0 2px 4px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5);
  --t-red:rgba(255,69,58,.2);--t-blue:rgba(10,132,255,.22);--t-teal:rgba(64,200,224,.22);--t-orange:rgba(255,159,10,.2);--t-green:rgba(48,209,88,.2);--t-purple:rgba(191,90,242,.22);--t-gray:rgba(142,142,147,.24);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:1.0625rem;line-height:22px;letter-spacing:-.026em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
a{color:var(--blue-text)}

.t-lt{font-size:2.125rem;line-height:41px;font-weight:700;letter-spacing:.012em;text-wrap:balance}
.t-t2{font-size:1.375rem;line-height:28px;font-weight:700;letter-spacing:-.012em}
.t-t3{font-size:1.25rem;line-height:25px;font-weight:600;letter-spacing:-.023em}
.t-hl{font-size:1.0625rem;line-height:22px;font-weight:600}
.t-sub{font-size:.9375rem;line-height:20px;letter-spacing:-.016em}
.t-fn{font-size:.8125rem;line-height:18px;letter-spacing:-.006em}
.t-c1{font-size:.75rem;line-height:16px;letter-spacing:0}
.t-title1{font-size:1.75rem;line-height:34px;font-weight:700;letter-spacing:.014em}
.c2{color:var(--label-2)}.num{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100%}
.side{position:sticky;top:0;align-self:flex-start;height:100vh;width:var(--side);flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding:20px 12px 16px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-right:.5px solid var(--glass-border)}
.marke{padding:0 12px}
.suche-knopf{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:var(--r-ctl);background:var(--fill);color:var(--label-2);text-align:left}
.suche-knopf kbd{margin-left:auto;font:inherit;font-size:.75rem;background:var(--surface);border-radius:6px;padding:1px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-ctl);color:var(--label);text-decoration:none}
.nav a:hover{background:var(--fill)}
.nav a[aria-current="page"]{background:var(--fill-2);font-weight:600}
.ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ico svg{width:17px;height:17px}
.mark{margin-top:auto;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.mark .rund{width:36px;height:36px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label-2)}

main{flex:1;min-width:0;padding-block:40px 64px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.kopf{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.kopf p{margin-top:4px}
section>h2{margin-bottom:12px}
.zeile-titel{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow)}
.gruppe{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.gruppe>li+li{border-top:.5px solid var(--sep)}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}

.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border-radius:var(--r-ctl);font-size:1rem;font-weight:600;transition:transform .16s cubic-bezier(.2,.8,.2,1),filter .16s}
a.knopf{text-decoration:none}
.knopf svg{width:18px;height:18px;flex:none}
.knopf{white-space:nowrap}
.knopf:active{transform:scale(.97)}
.primaer{background:var(--blue);color:#fff}.primaer:hover{filter:brightness(1.06)}
.sekundaer{background:var(--fill);color:var(--blue-text)}.sekundaer:hover{background:var(--fill-2)}
.knopf:disabled{opacity:.45;cursor:not-allowed}
.feld{min-height:44px;width:100%;padding:0 12px;border-radius:var(--r-ctl);background:var(--fill);border:1px solid transparent}
textarea.feld{padding:10px 12px;min-height:88px;resize:vertical}
.feld::placeholder{color:var(--label-3)}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(0,122,255,.35);border-radius:var(--r-ctl)}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:.8125rem;line-height:18px;color:var(--label-2)}

.pille{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.75rem;line-height:16px;font-weight:600;white-space:nowrap;letter-spacing:0}
.pille svg{width:12px;height:12px}
.meta{background:var(--fill);color:var(--label-2);font-weight:500}
.warn{background:var(--t-red);color:var(--red-text)}

.top3 a{display:flex;flex-direction:column;gap:12px;height:100%;padding:20px;color:inherit;text-decoration:none;transition:box-shadow .2s}
.top3 a:hover{box-shadow:var(--shadow-hover)}
.platz{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.top3 .fuss{margin-top:auto}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--fill)}
.tabs button{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;font-size:.9375rem;color:var(--label-2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--label);font-weight:600;box-shadow:var(--shadow)}
.tabs .z{font-size:.75rem;color:var(--label-2)}
.werkzeug{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
.werkzeug .knopf{margin-left:auto}
.filter{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 220px 220px;margin-bottom:24px}
.mit-ico{position:relative}.mit-ico svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--label-3);pointer-events:none}
.mit-ico .feld{padding-left:40px}

.az{scroll-margin-top:96px}
.az-kopf{display:flex;align-items:flex-start;gap:12px;padding:12px 16px}
.haken{width:44px;height:44px;margin:-10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.haken span{width:24px;height:24px;border-radius:50%;border:2px solid var(--label-3);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.haken[aria-pressed="true"] span{background:var(--green);border-color:var(--green)}
.az-text{flex:1;min-width:0;text-align:left;border-radius:10px}
.az-titel{display:flex;gap:8px;align-items:flex-start}
.az-titel .t{flex:1}
.az-titel svg{width:18px;height:18px;color:var(--label-3);flex-shrink:0;margin-top:2px;transition:transform .2s}
.az-text[aria-expanded="true"] .az-titel svg{transform:rotate(180deg)}
.erledigt .az-titel .t{text-decoration:line-through;color:var(--label-2)}
.pillen{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.az-detail{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));padding:16px;border-top:.5px solid var(--sep);background:var(--surface-2)}
.az-detail .breit{grid-column:1/-1}
.gruppen{display:flex;flex-direction:column;gap:24px}
.gruppen h2{display:flex;align-items:baseline;gap:8px;padding:0 4px;margin-bottom:8px}

.ziel{display:flex;flex-direction:column;gap:12px;padding:20px}
.ziel .oben{display:flex;justify-content:space-between;gap:8px}
.balken{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.balken div{height:100%;background:var(--green);border-radius:99px;transition:width .5s}
.ziel form{display:flex;gap:8px}
.stift{width:44px;height:44px;margin:-10px -12px 0 0;display:flex;align-items:center;justify-content:center;color:var(--blue-text);border-radius:var(--r-ctl)}
.stift svg{width:17px;height:17px}

.box{padding:20px;display:flex;flex-direction:column;gap:12px}
.box h2{display:flex;align-items:center;gap:8px;margin:0}
.box h2 svg{width:18px;height:18px}
.liste-klein{display:flex;flex-direction:column;gap:8px}
.liste-klein a{color:inherit;text-decoration:none}
.liste-klein a:hover{text-decoration:underline}
.briefing{display:flex;align-items:center;gap:16px;padding:24px}
.briefing .ico{width:48px;height:48px;border-radius:14px}
.briefing .ico svg{width:24px;height:24px}
.briefing>div{flex:1;min-width:0}
.brief-voll{padding:24px;display:flex;flex-direction:column;gap:16px}
.brief-kopf{display:flex;align-items:center;gap:16px}
.brief-kopf .ico{width:48px;height:48px;border-radius:14px}.brief-kopf .ico svg{width:24px;height:24px}
.brief-text{max-width:72ch}
.brief-abschnitte{display:grid;gap:16px 24px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.brief-abschnitte ul{list-style:disc;padding-left:18px;margin-top:4px;display:flex;flex-direction:column;gap:4px}
.frei-liste{display:flex;flex-direction:column;gap:16px}
.frei{padding:20px;display:flex;flex-direction:column;gap:10px}
.frei-kopf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.frei-inhalt{white-space:pre-wrap;background:var(--surface-2);border-radius:14px;padding:14px 16px;max-width:72ch}
.frei-edit{min-height:180px}
.frei-knoepfe{display:flex;flex-wrap:wrap;gap:12px}
details summary{cursor:pointer;min-height:32px;display:flex;align-items:center;gap:4px}
.steckbrief{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.steckbrief dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px}
.steckbrief ul{list-style:disc;padding-left:18px;display:flex;flex-direction:column;gap:2px}
@media (max-width:560px){.steckbrief dl{grid-template-columns:minmax(0,1fr)}}
.ereignis{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:12px 16px}
.ereignis .d{flex-basis:100%}

.partner{padding:20px;display:flex;flex-direction:column;gap:16px}
.partner .oben{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:600;flex-shrink:0}
.chance{padding:16px;display:flex;flex-direction:column;gap:10px}
.chance .oben{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chance-felder{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chance-knoepfe{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px;text-decoration:none;color:inherit;min-height:112px;transition:box-shadow .15s ease}
.kpi:hover{box-shadow:var(--shadow-hover)}
.kpi-label{text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi-wert{font-size:1.5rem;line-height:1.2;font-weight:700;letter-spacing:.003em}
.mini-balken{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:auto}
.mini-balken div{height:100%;border-radius:3px}
.seg-balken{display:flex;gap:2px;height:6px;margin-top:auto;border-radius:3px;overflow:hidden;background:var(--fill)}
.spark{display:flex;gap:3px;align-items:flex-end;height:22px;margin-top:auto}
.spark div{flex:1;background:var(--green);border-radius:2px 2px 0 0;min-height:2px}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.tile{grid-column:span 4;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile-5{grid-column:span 5}.tile-7{grid-column:span 7}
.tile-kopf{display:flex;align-items:center;gap:8px}
.tile-kopf h2{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.ico-mini{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ico-mini svg{width:14px;height:14px}
.tile-link{font-weight:600;text-decoration:none;min-height:32px;display:flex;align-items:center}
.tile-sub{font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.zahl-badge{font-size:.75rem;font-weight:700;background:var(--fill);color:var(--label-2);border-radius:999px;padding:1px 8px}
.mini-liste{display:flex;flex-direction:column}
.mini-liste>li{display:flex;gap:10px;align-items:center;padding:6px 0;min-height:40px}
.mini-liste>li+li{border-top:.5px solid var(--sep)}
.mini-titel{display:flex;flex-direction:column;flex:1;min-width:0;text-align:left;text-decoration:none;color:inherit;min-height:36px;justify-content:center}
.mini-titel .t-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.mini-titel:hover .t-sub,a.mini-titel:hover .t-sub{color:var(--blue-text)}
details.mini-titel summary{display:flex;flex-direction:column;cursor:pointer;list-style:none}
details.mini-titel summary::-webkit-details-marker{display:none}
.platz-mini{width:22px;height:22px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex:none}
.knopf.mini{min-height:36px;min-width:36px;padding:0;border-radius:10px}
.knopf.mini svg{width:16px;height:16px}
.clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.brief-mehr summary{color:var(--blue-text);font-weight:600;cursor:pointer;min-height:32px;display:flex;align-items:center}
.brief-mehr ul{padding-left:16px;list-style:disc}
table.wer{width:100%;border-collapse:collapse}
table.wer th,table.wer td{text-align:left;padding:7px 6px;border-top:.5px solid var(--sep);vertical-align:middle;font-size:.875rem}
table.wer thead th{border-top:0;font-size:.75rem;color:var(--label-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
table.wer td.num,table.wer th.num{text-align:right;width:76px}
table.wer tbody th{font-weight:400;white-space:nowrap}
.wer-name{font-weight:600;display:block}
table.wer{table-layout:fixed}
table.wer th,table.wer td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wer-zuletzt{display:table-cell}
.wer-zuletzt .wer-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wer-zuletzt .t-c1{display:block}
.wer-name{overflow:hidden;text-overflow:ellipsis}
.tile-6{grid-column:span 6}.tile-12{grid-column:span 12}
.mini-liste.zwei{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.mini-liste.zwei>li+li{border-top:0}
.mini-liste.zwei>li{border-bottom:.5px solid var(--sep)}
details.mini-titel summary{align-items:flex-start;text-align:left;min-width:0}
details.mini-titel summary .t-sub{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-anruf .lead.kompakt{padding:5px 0}
.mini-anruf .lead-aktion select.feld{min-width:120px;min-height:36px;font-size:.875rem}
.mini-anruf .lead-aktion .knopf{min-height:36px;font-size:.8125rem;padding:0 10px}

.pipe-mini{display:flex;flex-direction:column;gap:7px}
.pipe-mini li{display:grid;grid-template-columns:8px 90px 1fr 22px 84px;gap:8px;align-items:center}
.pipe-mini .tb{height:8px;background:var(--fill);border-radius:4px;overflow:hidden}
.pipe-mini .tb div{height:100%;border-radius:4px}
.pm-s{text-align:right}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tile,.tile-5,.tile-6,.tile-7{grid-column:span 6}.tile-7,.tile-12{grid-column:span 12}}
@media (max-width:1100px){.tile-6{grid-column:span 12}}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.tile,.tile-5,.tile-6,.tile-7,.tile-12{grid-column:span 12}table.wer col:nth-child(2),table.wer td:nth-child(2),table.wer th:nth-child(2){display:none}.mini-liste.zwei{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.kpi{transition:none}}

function vorZeit(iso){
  if(!iso) return "";
  const t = new Date(iso).getTime(); if(isNaN(t)) return "";
  const min = Math.round((Date.now()-t)/60000);
  if(min<1) return "gerade eben"; if(min<60) return `vor ${min} Min.`;
  const std = Math.round(min/60); if(std<24) return `vor ${std} Std.`;
  const tg = Math.round(std/24); if(tg===1) return "gestern"; if(tg<7) return `vor ${tg} Tagen`;
  return datumDe(String(iso).slice(0,10));
}

    ${kpi("Pipeline offen", euro(offenSumme), `${offenNeu.length} Chancen · ${euro(z.heissSumme)} heiß`, `<div class="seg-balken">${stufen.filter(x=>x.st!=="Gewonnen").map(x=>`<div style="flex:${x.s||0.0001};background:${STUFE_FARBE[x.st]}" title="${x.st}: ${euro(x.s)}"></div>`).join("")}</div>`, "#sales")}
    ${kpi("Anrufe offen", anrufeOffen.length, `${tage.reduce((x,t)=>x+t.n,0)} Anrufe in 7 Tagen`, `<div class="spark">${tage.map(t=>`<div title="${t.wt}: ${t.n}" style="height:${Math.max(8,t.n/maxT*100)}%;${t.n?"":"opacity:.35"}"></div>`).join("")}</div>`, "#leads")}
    ${kpi("Freigaben", fr.length, aeltesteFr?`älteste ${vorZeit(aeltesteFr)}`:"nichts offen", "", "#content")}
    ${kpi("Deine Aufgaben", meine.filter(a=>a.status!=="später").length, `${sofort} sofort · ${ueber} überfällig${pruefen?` · ${pruefen} prüfen`:""}`, miniBalken(sofort/Math.max(1,meine.length),"var(--red)"), "#aufgaben")}
    ${kpi("Agenten", `${agAktiv}/${S.agenten.length}`, org?.letzteAktionAm?`Organisator ${vorZeit(org.letzteAktionAm)}`:"aktiv", miniBalken(agAktiv/Math.max(1,S.agenten.length),"var(--blue)"), "#agenten")}
  </div>
  <div class="dash">
    <section class="card tile tile-5" aria-labelledby="h-brief">${kachelKopf(`<span id="h-brief">${b?(b.art==="abend"?"Tagesabschluss":"Morgen-Briefing"):"Briefing"}</span>`,"zeitung",b?.art==="abend"?"var(--purple)":"var(--orange)")}
      ${b?`<p class="t-c1 c2">${esc(datumLang(b.erstelltAm))} · ${esc(uhrzeit(b.erstelltAm))} Uhr</p><p class="t-sub clamp4">${esc(b.zusammenfassung||"")}</p>${(b.abschnitte||[]).length?`<details class="brief-mehr"><summary class="t-fn">Ganzes Briefing</summary>${b.abschnitte.map(a=>`<h3 class="t-fn" style="font-weight:600;margin-top:8px">${esc(a.titel)}</h3><ul>${(a.punkte||[]).map(x=>`<li class="t-fn">${esc(x)}</li>`).join("")}</ul>`).join("")}</details>`:""}`:`<p class="t-sub c2">Kommt werktags um 06:15.</p>`}

      <p class="t-c1 c2">Kalender noch nicht verbunden.</p>
    </section>
    ${wermachtwasHtml()}
    <section class="card tile tile-6" aria-labelledby="h-anruf">${kachelKopf(`<span id="h-anruf">Heute anrufen</span>${anrufeOffen.length?` <span class="zahl-badge">${anrufeOffen.length}</span>`:""}`,"telefon","var(--green)","#leads","Leads")}
      ${anrufeOffen.length?`<ul class="lead-liste mini-anruf">${[...anrufeOffen].sort(leadSort).slice(0,6).map(l=>leadZeile(l,true)).join("")}</ul>`:`<p class="t-sub c2">Keine offenen Anrufe.</p>`}
    </section>
    ${freigabenMiniHtml()}
    <section class="card tile" aria-labelledby="h-pipe">${kachelKopf(`<span id="h-pipe">Pipeline</span>`,"trichter","var(--indigo)","#sales","Sales")}
      <ul class="pipe-mini">${stufen.map(x=>`<li><span class="punkt-s" style="background:${STUFE_FARBE[x.st]}"></span><span class="t-fn">${x.st}</span><div class="tb"><div style="width:${x.s/maxS*100}%;background:${STUFE_FARBE[x.st]}"></div></div><span class="t-fn num">${x.n}</span><span class="t-fn num pm-s">${x.s?euro(x.s):"–"}</span></li>`).join("")}</ul>
      <p class="t-c1 c2">Laufend ${euro(z.laufend)}/Jahr · Klumpenrisiko <span style="color:${z.anteil>0.6?"var(--red-text)":"var(--green-text)"};font-weight:600">${Math.round(z.anteil*100)} %</span></p>
    </section>
    <section class="card tile" aria-labelledby="h-wf">${kachelKopf(`<span id="h-wf">Wochenfokus KW ${kw()}</span>`,"ziel","var(--red)","#sales","Ändern")}
      ${fokus.length?`<ol class="mini-liste">${fokus.map((f,i)=>`<li><span class="platz-mini">${i+1}</span><span class="t-sub">${esc(f)}</span></li>`).join("")}</ol>`:`<p class="t-sub c2">Noch kein Fokus gesetzt.</p>`}
    </section>
    <section class="card tile" aria-labelledby="h-ges">${kachelKopf(`<span id="h-ges">Gespräche</span>`,"bot","var(--blue)")}
      ${ges.length?`<ul class="mini-liste">${ges.map(g=>`<li><span class="t-c1 c2 num" style="min-width:42px">${esc(datumDe(g.datum).slice(0,6))}</span><details class="mini-titel"><summary><span class="t-sub">${esc(g.titel||"Gespräch")}</span><span class="t-c1 c2">${esc(g.agent||"")}</span></summary><p class="t-fn c2" style="white-space:pre-wrap;margin-top:4px">${esc(g.zusammenfassung||"")}</p></details></li>`).join("")}</ul>`:`<p class="t-sub c2">Noch keine Gespräche.</p>`}
    </section>
    <section class="card tile tile-12" aria-labelledby="h-verl">${kachelKopf(`<span id="h-verl">Zuletzt passiert</span>`,"uhr","var(--gray)")}
      ${S.ereignisse.length?`<ul class="mini-liste zwei">${S.ereignisse.slice(0,8).map(e=>`<li><span class="t-c1 c2" style="min-width:64px">${esc(vorZeit(e.zeit))}</span><span style="min-width:0;flex:1"><span class="t-fn" style="font-weight:600">${esc(e.akteur)}</span> <span class="t-fn">${esc(e.aktion)}</span>${e.objekt?`<span class="t-c1 c2"> · ${esc(e.objekt)}</span>`:""}</span></li>`).join("")}</ul>`:`<p class="t-sub c2">Noch keine Einträge.</p>`}
    </section>
  </div>`;
}

function seiteAufgaben(){
  const offenAnz = S.aufgaben.filter(a=>a.status!=="erledigt").length;
  const pruefAnz = S.aufgaben.filter(a=>a.status==="prüfen").length;
  const v = ANSICHTEN.find(x=>x[0]===S.ansicht);
  const s = S.suche.trim().toLowerCase();
  const gef = sortiert().filter(a =>
    (!v[2] || v[2].includes(a.status)) &&
    (!S.fPartner || partnerVon(a).includes(S.fPartner) || (S.fPartner!=="C&E intern" && partnerVon(a).includes("Alle Partner"))) &&
    (!S.fZust || a.zustaendig===S.fZust) &&
    (!s || `${a.aufgabe} ${a.naechsterSchritt||""} ${a.id} ${partnerVon(a).join(" ")}`.toLowerCase().includes(s)));
  const zaehl = id => { const x = ANSICHTEN.find(y=>y[0]===id); return x[2] ? S.aufgaben.filter(a=>x[2].includes(a.status)).length : S.aufgaben.length; };
  const partnerNamen = S.partner.map(p=>p.name).sort();
  let gruppen = "";
  for(const g of [1,2,3,4,null]){
    const liste = gef.filter(a => a.status==="erledigt" ? g===null : prio(a)===g);
    if(!liste.length) continue;
    const titel = g===null ? (S.ansicht==="erledigt"?"Erledigt":"Noch nicht eingeschätzt") : `${g} ${PRIO_NAME[g]}`;
    const erkl = g===null ? (S.ansicht==="erledigt"?"":"Wichtig und Dringend setzen") : PRIO_ERKL[g];
    gruppen += `<section aria-labelledby="g-${g}"><h2 id="g-${g}"><span class="t-t3">${titel}</span><span class="t-sub c2">${liste.length}${erkl?` · ${erkl}`:""}</span></h2><ul class="gruppe">${liste.map(zeileHtml).join("")}</ul></section>`;
  }
  return `${kopf("Aufgaben", geladen()?`${offenAnz} offen${pruefAnz?` · ${pruefAnz} zum Prüfen aus früheren Gesprächen`:""}`:"Wird geladen …")}
  ${verbindungsHinweis()}
  <section aria-labelledby="h-top"><h2 id="h-top" class="t-t2">Top 3 heute</h2>${top3Html()}</section>
  <section aria-label="Aufgabenliste">
    <div class="werkzeug"><div class="tabs" role="tablist" aria-label="Ansicht">${ANSICHTEN.map(([id,t])=>`<button role="tab" aria-selected="${S.ansicht===id}" data-aktion="ansicht" data-id="${id}">${t}<span class="z num">${zaehl(id)}</span></button>`).join("")}</div>
    <button class="knopf primaer" data-aktion="neu" ${S.nurLesen||!S.db?"disabled":""}>${ic("plus",'width="18" height="18"')}Neue Aufgabe</button></div>
    <div class="filter">
      <label class="mit-ico">${ic("lupe")}<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Aufgaben durchsuchen</span><input id="f-suche" class="feld" placeholder="Durchsuchen" value="${esc(S.suche)}"></label>
      <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Partner</span><select id="f-partner" class="feld"><option value="">Alle Partner</option>${[...partnerNamen,"C&E intern"].map(p=>`<option ${S.fPartner===p?"selected":""}>${esc(p)}</option>`).join("")}</select></label>
      <label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Zuständig</span><select id="f-zust" class="feld"><option value="">Alle Zuständigen</option>${ZUST.map(z=>`<option ${S.fZust===z?"selected":""}>${z}</option>`).join("")}</select></label>
    </div>
    ${geladen() && !gef.length ? `<div class="card c2" style="padding:40px;text-align:center">Keine Aufgaben in dieser Ansicht.</div>` : ""}

  </section>`;

const LSTUFEN = ["Empfehlung","Neu","Angesprochen","Vorgespräch","Angebot","Gewonnen","Kein Interesse"];
const ERGEBNIS_LEAD = ["Nicht erreicht","Rückruf vereinbart","Termin vereinbart","Unterlagen schicken","Kein Interesse"];
const ERGEBNIS_ANFRAGE = ["Nicht erreicht","Rückruf vereinbart","Empfehlung erhalten","Keine Empfehlung"];
const telHref = t => "tel:"+String(t||"").split(/[,(]/)[0].replace(/[^\d+]/g,"").replace(/^(?!\+|00)/,"+352");
const istAnfrage = l => l.typ==="anfrage";
const leadOffen = l => istAnfrage(l) ? l.stufe==="Offen" : !["Gewonnen","Kein Interesse"].includes(l.stufe);
function leadRang(l){ if(istAnfrage(l)) return 0; if(l.prioritaet==="A") return 1; if(/sofort|termin|uhr|handy|chef/i.test(l.naechsterSchritt||"")) return 2; return 3; }
const leadSort = (a,b) => leadRang(a)-leadRang(b) || String(a.letzterKontakt||"").localeCompare(String(b.letzterKontakt||"")) || a.betrieb.localeCompare(b.betrieb);
function zweck(l){
  const ns = String(l.naechsterSchritt||"").toLowerCase();
  if(istAnfrage(l)) return ["Empfehlung anfragen","var(--t-purple)","var(--purple-text)","var(--purple)"];
  if(l.stufe==="Vorgespräch") return ["Termin vorbereiten","var(--t-blue)","var(--blue-text)","var(--blue)"];
  if(/termin/.test(ns)) return ["Termin fixieren","var(--t-blue)","var(--blue-text)","var(--blue)"];
  if(l.prioritaet==="A") return ["Empfehlung","var(--t-green)","var(--green-text)","var(--green)"];
  if(/rückruf|zurückrufen|uhr/.test(ns)) return ["Rückruf","var(--t-orange)","var(--orange-text)","var(--orange)"];
  if(/follow|nachfass|nachholen/.test(ns)) return ["Nachfassen","var(--t-orange)","var(--orange-text)","var(--orange)"];
  if(/unterlagen|mail/.test(ns)) return ["Unterlagen","var(--t-teal)","var(--teal-text)","var(--teal)"];
  if(l.stufe==="Neu"||/erstanruf/.test(ns)) return ["Erstanruf","var(--t-gray)","var(--label-2)","var(--gray)"];
  return ["Anruf","var(--t-gray)","var(--label-2)","var(--gray)"];
}

      ${letzte?`<div class="t-fn c2">Zuletzt ${esc(datumDe(letzte.datum))}: ${esc(letzte.ergebnis)}${letzte.notiz?` · ${esc(letzte.notiz)}`:""}</div>`:""}

    </div>`}
    <div class="lead-aktion">

    </div>
  </li>`;
}

function wocheStart(){ const d = new Date(heute()+"T12:00:00"); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return d.toISOString().slice(0,10); }
function kw(){ const d = new Date(heute()+"T12:00:00"); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const j = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-j)/86400000+1)/7); }
function salesZahlen(){
  const pz = pipeZahlen();
  const vertr = S.partner.filter(p=>p.vertrag&&Number(p.vertrag.volumenJahr)>0).map(p=>({name:p.name, v:Number(p.vertrag.volumenJahr), ap:p.vertrag.ansprechpartner||"–", ende:p.vertrag.vertragsende, p}));
  const laufend = vertr.reduce((x,c)=>x+c.v,0);
  const top3 = [...vertr].sort((a,b)=>b.v-a.v).slice(0,3).reduce((x,c)=>x+c.v,0);
  const proPerson = {}; vertr.forEach(c=>{ proPerson[c.ap]=(proPerson[c.ap]||0)+c.v; });
  const [person, personV] = Object.entries(proPerson).sort((a,b)=>b[1]-a[1])[0]||["–",0];
  const offen = S.pipeline.filter(c=>c.stufe!=="Gewonnen"&&c.stufe!=="Verloren");
  const heiss = offen.filter(c=>["Angebot","Verhandlung"].includes(c.stufe)&&c.art!=="bestand");
  const ws = wocheStart(), monat = heute().slice(0,7);

async function aendere(id, feld, roh){
  if(!S.db) return;
  let wert = roh;
  if(feld==="wichtig"||feld==="dringend") wert = roh==="ja"?true:roh==="nein"?false:null;
  else if(typeof roh==="string"){ wert = roh.trim()===""?null:roh.trim(); }

    protokoll("Aufgabe geändert", id, `${FELDNAME[feld]}: ${wert===true?"ja":wert===false?"nein":wert??"leer"}`);
  }catch(e){ schreibFehler(e); }

async function aenderePipe(id, feld, roh){
  if(!S.db) return;
  const c = S.pipeline.find(x=>x.id===id); if(!c) return;
  let wert = roh;
  if(feld==="betrag"||feld==="wahrscheinlichkeit"){
    const t = String(roh??"").trim().replace(/[€%\s]/g,"").replace(/\./g,"").replace(",",".");
    wert = t===""?null:Number(t);
    if(wert!==null && Number.isNaN(wert)){ zeigeToast("Bitte eine Zahl eingeben, zum Beispiel 25.000"); render(); return; }
    if(feld==="wahrscheinlichkeit" && wert!==null) wert = Math.max(0,Math.min(100,Math.round(wert)));
  }
  if(c[feld]===wert) return;

let zug = null;
function zugAufraeumen(){
  if(!zug) return;
  clearTimeout(zug.timer);
  zug.geist?.remove(); zug.k.classList.remove("pk-weg");
  document.querySelectorAll(".spalte.ziel").forEach(x=>x.classList.remove("ziel"));
  document.body.classList.remove("zieht");
  cancelAnimationFrame(zug.raf);
  zug = null; S.ziehen = false;

function zugStart(){
  if(!zug || zug.aktiv) return;
  zug.aktiv = true; S.ziehen = true;
  const r = zug.k.getBoundingClientRect();
  zug.dx = zug.x - r.left; zug.dy = zug.y - r.top;
  const g = zug.k.cloneNode(true); g.className = "pk pk-geist"; g.removeAttribute("data-pkarte"); g.style.width = r.width+"px";
  document.body.appendChild(g); zug.geist = g; zug.k.classList.add("pk-weg"); document.body.classList.add("zieht");
  zugBewegen(zug.x, zug.y);
  if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){}
}
function zugBewegen(x, y){
  if(!zug?.aktiv) return;
  zug.x = x; zug.y = y;
  zug.geist.style.transform = `translate(${x-zug.dx}px,${y-zug.dy}px) rotate(2deg)`;
  const ziel = document.elementFromPoint(x, y)?.closest(".spalte");
  document.querySelectorAll(".spalte.ziel").forEach(s=>{ if(s!==ziel) s.classList.remove("ziel"); });
  if(ziel) ziel.classList.add("ziel");
  zug.ziel = ziel || null;
  const board = zug.k.closest(".board");
  cancelAnimationFrame(zug.raf);
  if(board){ const br = board.getBoundingClientRect(); const rand = 48; const v = x < br.left+rand ? -12 : x > br.right-rand ? 12 : 0;
    if(v){ const schritt = () => { if(!zug?.aktiv) return; board.scrollLeft += v; zugZielNeu(); zug.raf = requestAnimationFrame(schritt); }; zug.raf = requestAnimationFrame(schritt); } }
}

async function freigabeAktion(fid, was){
  const f = S.freigaben.find(x=>x.id===fid); if(!f || !S.db) return;
  const jetzt = new Date().toISOString();
  try{
    if(was==="aufklappen"){ const k="frei:"+fid; S.offen.has(k)?S.offen.delete(k):S.offen.add(k); if(S.bearbeite===fid && !S.offen.has(k)) S.bearbeite=null; render(); return; }
    if(was==="bearbeiten"){ S.bearbeite = fid; render(); document.getElementById("fe-"+fid)?.focus(); return; }
    if(was==="abbrechen"){ S.bearbeite = null; render(); return; }
    if(was==="speichern"){
      const t = document.getElementById("fe-"+fid)?.value ?? f.inhalt;
      S.bearbeite = null; document.activeElement?.blur();
      await S.db.doc("freigaben/"+fid).update({inhalt:t, bearbeitetAm:jetzt});
      protokoll("Entwurf bearbeitet", fid, f.titel); zeigeToast("Entwurf gespeichert"); render(); return;
    }
    if(was==="freigeben"){
      let kopiert = false;
      if(f.inhalt && f.art!=="Dateiaktion"){ try{ await navigator.clipboard.writeText(f.inhalt); kopiert = true; }catch(e){} }
      await S.db.doc("freigaben/"+fid).update({status:"freigegeben", entschiedenAm:jetzt});
      if(fid==="akquiseplan-12m"){ try{ await S.db.doc("system/akquiseplan").update({status:"freigegeben", freigegebenAm:jetzt}); }catch(e){} }
      protokoll("Freigegeben", fid, f.titel);
      zeigeToast(kopiert ? "Freigegeben und kopiert. Jetzt einfügen und selbst senden." : "Freigegeben");
      return;
    }
    if(was==="verwerfen"){
      await S.db.doc("freigaben/"+fid).update({status:"verworfen", entschiedenAm:jetzt});
      protokoll("Verworfen", fid, f.titel); zeigeToast("Verworfen"); return;
    }
  }catch(e){ schreibFehler(e); }
}

seite.addEventListener("click", e => {
  const pj = e.target.closest("[data-pjahr]"); if(pj){ S.pJahr = pj.dataset.pjahr; render(); return; }
  if(e.target.closest("[data-pneu]")){ oeffneChance(); return; }
  const fo = e.target.closest("[data-freioffen]"); if(fo){ oeffneFreigabe(fo.dataset.freioffen); return; }
  const pk = e.target.closest("[data-pkarte]"); if(pk){ if(Date.now()-(S.zugEnde||0)<350) return; oeffneChanceDetail(pk.dataset.pkarte); return; }
  if(e.target.closest("[data-lneu]")){ oeffneLead(); return; }
  const lf = e.target.closest("[data-lfilter]"); if(lf){ S.lFilter = lf.dataset.lfilter; render(); return; }
  const pa = e.target.closest("[data-pauftrag]"); if(pa){ const k = pa.closest("[data-cid]"); if(k) pipeAuftrag(k.dataset.cid, pa.dataset.pauftrag); return; }
  const ag = e.target.closest("[data-agauftrag]"); if(ag){ agentAuftrag(ag.dataset.agauftrag); return; }
  const zl = e.target.closest("[data-zust]"); if(zl){ S.fZust = zl.dataset.zust; S.fPartner=""; S.suche=""; S.ansicht="alle"; }
  const fb = e.target.closest("[data-frei]");
  if(fb){ const li = fb.closest("[data-fid]"); if(li) freigabeAktion(li.dataset.fid, fb.dataset.frei); return; }
  const el = e.target.closest("[data-aktion]");
  const ans = e.target.closest("[data-ansicht]"); if(ans){ S.ansicht = ans.dataset.ansicht; }
  if(!el) return;
  const akt = el.dataset.aktion, li = el.closest("[data-id]");
  if(akt==="ansicht"){ S.ansicht = el.dataset.id; render(); }
  else if(akt==="neu"){ oeffneNeu(); }
  else if(akt==="auf"){ const id = li.dataset.id; S.offen.has(id)?S.offen.delete(id):S.offen.add(id); render(); }
  else if(akt==="haken"){ const a = S.aufgaben.find(x=>x.id===li.dataset.id); if(a) aendere(a.id,"status",a.status==="erledigt"?"offen":"erledigt"); }
  else if(akt==="ziel-bearb"){ const k="ziel:"+el.dataset.id; S.offen.has(k)?S.offen.delete(k):S.offen.add(k); render(); document.getElementById("ziel-"+el.dataset.id)?.focus(); }
});
seite.addEventListener("change", e => {
  const t = e.target;
  if(t.id==="f-partner"){ S.fPartner = t.value; render(); return; }
  if(t.id==="f-zust"){ S.fZust = t.value; render(); return; }
  if(t.hasAttribute("data-lergebnis")){ const r = t.closest("[data-lid]"); if(r) leadErgebnis(r.dataset.lid, t.value); return; }
  if(t.dataset.pfeld){ const k = t.closest("[data-cid]"); if(k) aenderePipe(k.dataset.cid, t.dataset.pfeld, t.value||null); return; }
  const feld = t.dataset.feld; if(!feld) return;
  const li = t.closest("[data-id]"); if(!li) return;
  if(t.hasAttribute("data-text")) return; // Textfelder speichern beim Verlassen
  aendere(li.dataset.id, feld, t.value);
});
seite.addEventListener("input", e => { if(e.target.id==="l-suche"){ S.lSuche = e.target.value; clearTimeout(seite._l); seite._l = setTimeout(()=>{ const pos = e.target.selectionStart; S.renderOffen=false; document.activeElement.blur(); render(); const n=document.getElementById("l-suche"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }, 180); return; } if(e.target.id==="f-suche"){ S.suche = e.target.value; clearTimeout(seite._s); seite._s = setTimeout(()=>{ const pos = e.target.selectionStart; S.renderOffen=false; const f=document.activeElement; f.blur(); render(); const n=document.getElementById("f-suche"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }, 180); } });
seite.addEventListener("focusout", e => {
  const t = e.target;
  if(t.dataset && t.dataset.fokus!=null){ setzeFokus(Number(t.dataset.fokus), t.value); }
  else if(t.hasAttribute && t.hasAttribute("data-text")){ const li = t.closest("[data-id]"); if(li) aendere(li.dataset.id, t.dataset.feld, t.value); }
  setTimeout(()=>{ if(S.renderOffen && !(document.activeElement && document.activeElement.matches && document.activeElement.matches("main textarea, main input[data-text], main input#f-suche, main form input"))) render(); }, 0);
});
seite.addEventListener("submit", e => {
  const f = e.target; if(f.dataset.form!=="ziel") return;
  e.preventDefault(); const id = f.dataset.id; const w = f.elements.ist.value;
  S.offen.delete("ziel:"+id); document.activeElement?.blur(); render(); setzeZiel(id, w);
});

document.getElementById("suche-knopf").addEventListener("click", oeffnePalette);
window.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if(mod && e.key.toLowerCase()==="k"){ e.preventDefault(); schicht.innerHTML ? schliesseSchicht() : oeffnePalette(); return; }
  if(mod && /^[1-9]$/.test(e.key)){ e.preventDefault(); location.hash = NAV[Number(e.key)-1].id; return; }
  if(e.key==="Escape" && schicht.innerHTML){ e.preventDefault(); schliesseSchicht(); }
});
window.addEventListener("hashchange", () => {
  const v = ansichtAus();
  if(v.aufgabe){ if(!S.offen.has(v.aufgabe)){ S.offen.add(v.aufgabe); } const a = S.aufgaben.find(x=>x.id===v.aufgabe); if(a){ const pass = ANSICHTEN.find(x=>x[0]===S.ansicht); if(pass[2] && !pass[2].includes(a.status)) S.ansicht="alle"; } }
  render();
  if(v.aufgabe) requestAnimationFrame(()=>document.getElementById(v.aufgabe)?.scrollIntoView({block:"center"}));
  else window.scrollTo(0,0);
});

/* ---------- Gehirn verbinden ---------- */
render();
(async () => {
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db = null; }
  S.verbunden = true;
  if(!db){ render(); return; }
  S.db = db;
  const abo = (name, setze, q) => (q||db.collection(name)).onSnapshot(snap => { setze(snap.docs.map(d=>({id:d.id, ...d.data()}))); S.geladen[name]=true; render(); }, err => { if(err && err.code==="revoked"){ S.db=null; } render(); });
  abo("aufgaben", v => S.aufgaben = v);
  abo("ziele", v => S.ziele = v.sort((a,b)=>String(a.id).localeCompare(String(b.id))));
  abo("partner", v => S.partner = v);
  abo("agenten", v => S.agenten = v);
  abo("ereignisse", v => S.ereignisse = v, db.collection("ereignisse").orderBy("zeit","desc").limit(8));
  abo("briefings", v => S.briefings = v, db.collection("briefings").orderBy("erstelltAm","desc").limit(2));
  abo("freigaben", v => S.freigaben = v);
  abo("pipeline", v => S.pipeline = v);
  abo("leads", v => S.leads = v);
  abo("system", v => { S.system = Object.fromEntries(v.map(d=>[d.id,d])); });
  abo("gespraeche", v => S.gespraeche = v, db.collection("gespraeche").orderBy("datum","desc").limit(5));
  const v = ansichtAus(); if(v.aufgabe){ S.ansicht="alle"; S.offen.add(v.aufgabe); }
  render();
})();
})();
</script>
